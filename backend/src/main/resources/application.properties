spring.application.name=api

# DB
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:6543/agrupae}
spring.datasource.username=${DATABASE_USERNAME:admin}
spring.datasource.password=${DATABASE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=validate

# RSA
rsa.private-key=${PRIVATE_KEY:classpath:/certs/private.pem}
rsa.public-key=${PUBLIC_KEY:classpath:/certs/public.pem}

# JWT
jwt.access-token.ttl=${ACESS_TOKEN_TTL:900}
jwt.refresh-token.ttl=${REFRESH_TOKEN_TTL:604800}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}